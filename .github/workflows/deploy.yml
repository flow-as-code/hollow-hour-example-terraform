name: deploy

# Plans one environment and, when asked, applies that saved plan. Dispatch
# only: the Connect API throttle is shared by every instance in an account
# and Region, and a push must never reach a live environment.
#
# Two jobs. `plan` runs in the <environment>-plan GitHub environment, which
# has no reviewer, so the plan is in the run's summary before anyone is asked
# to approve anything. `apply` runs in the <environment> environment (prod
# has a required reviewer), downloads the exact plan `plan` wrote, and
# applies it; it runs only when `apply` is checked.
#
# Set up once (README.md, "Deploying from GitHub"):
#   repository secret        PLAN_ARTIFACT_KEY    a random passphrase that
#                                                 encrypts the saved plan
#                                                 between the two jobs
#   <env>-plan environment   secret   AWS_PLAN_ROLE_ARN    a read-only role
#                            secret   TF_STATE_BUCKET
#                            variable TF_STATE_REGION
#   <env> environment        secret   AWS_DEPLOY_ROLE_ARN  the deploy role
#                            secret   TF_STATE_BUCKET
#                            variable TF_STATE_REGION
# The role ARNs and the bucket are secrets, not variables: GitHub prints a
# step's with: and env: values in its log header before any add-mask can
# run, and masks only secrets there. The account id, every UUID and the
# instance alias are masked or redacted in the logs and the summary.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment
        type: choice
        options: [dev, qa, prod]
        required: true
      apply:
        description: Apply the saved plan (after approval, for prod). Unchecked, the run plans only.
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time across every environment, never cancelled halfway
# through an apply: qa and prod share us-east-1 and its Connect API throttle,
# and a second instance create while one is pending can be refused.
concurrency:
  group: hollow-hour-example-terraform-deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  ENVIRONMENT: ${{ inputs.environment }}
  ROOT: environments/${{ inputs.environment }}
  STATE_KEY: hollow-hour-example-terraform/${{ inputs.environment }}/terraform.tfstate

jobs:
  plan:
    name: plan / ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ~1.10.0
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
          mask-aws-account-id: true
      - name: Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          set -euo pipefail
          tofu -chdir="$ROOT" init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="use_lockfile=true" >/dev/null
      - name: Mask the instance id and alias
        run: |
          set -euo pipefail
          # Both empty before the first apply: the environment creates its
          # instance, and its alias carries a random suffix.
          for output in instance_id instance_alias; do
            value="$(tofu -chdir="$ROOT" output -raw "$output" 2>/dev/null || true)"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
      # Connect ids are UUIDs (the instance, its queues, hours and flows), and
      # ARNs carry the twelve-digit account id. Before the first apply nothing
      # can be masked in advance, so both are redacted as they are printed.
      - name: Plan
        run: |
          set -euo pipefail
          tofu -chdir="$ROOT" plan -input=false -no-color -out=deploy.tfplan 2>&1 \
            | sed -E -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g' \
              -e 's/(^|[^0-9])[0-9]{12}([^0-9]|$)/\1<account>\2/g'
      - name: Write the plan to the job summary
        run: |
          set -euo pipefail
          alias="$(tofu -chdir="$ROOT" output -raw instance_alias 2>/dev/null || true)"
          {
            echo "## Plan: $ENVIRONMENT"
            echo
            echo "The apply job applies this saved plan, and only when the run was dispatched with apply checked."
            echo
            echo '```'
            tofu -chdir="$ROOT" show -no-color deploy.tfplan \
              | sed -E -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g' \
                -e 's/(^|[^0-9])[0-9]{12}([^0-9]|$)/\1<account>\2/g' \
              | if [ -n "$alias" ]; then sed "s/$alias/<alias>/g"; else cat; fi \
              | head -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The saved plan holds state values (ids, ARNs, the account id), and a
      # public repository's artifacts can be downloaded by anyone, so it
      # travels encrypted. The Lambda zips archive_file wrote at plan time go
      # with it: the plan records their hashes, and apply reads the files.
      - name: Pack and encrypt the plan
        env:
          PLAN_ARTIFACT_KEY: ${{ secrets.PLAN_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          tar -C "$ROOT" -czf "$RUNNER_TEMP/plan.tgz" deploy.tfplan .build
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PLAN_ARTIFACT_KEY \
            -in "$RUNNER_TEMP/plan.tgz" -out "$RUNNER_TEMP/plan.tgz.enc"
          rm "$RUNNER_TEMP/plan.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-${{ inputs.environment }}
          path: ${{ runner.temp }}/plan.tgz.enc
          retention-days: 1
          if-no-files-found: error

  apply:
    name: apply / ${{ inputs.environment }}
    needs: plan
    if: inputs.apply
    runs-on: ubuntu-latest
    # Creating an instance can take several minutes; the first apply
    # creates one.
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ~1.10.0
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
          mask-aws-account-id: true
      - name: Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          set -euo pipefail
          tofu -chdir="$ROOT" init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="use_lockfile=true" >/dev/null
      - name: Mask the instance id and alias
        run: |
          set -euo pipefail
          for output in instance_id instance_alias; do
            value="$(tofu -chdir="$ROOT" output -raw "$output" 2>/dev/null || true)"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan-${{ inputs.environment }}
          path: ${{ runner.temp }}
      - name: Decrypt and unpack the plan
        env:
          PLAN_ARTIFACT_KEY: ${{ secrets.PLAN_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PLAN_ARTIFACT_KEY \
            -in "$RUNNER_TEMP/plan.tgz.enc" -out "$RUNNER_TEMP/plan.tgz"
          tar -C "$ROOT" -xzf "$RUNNER_TEMP/plan.tgz"
          rm "$RUNNER_TEMP/plan.tgz" "$RUNNER_TEMP/plan.tgz.enc"
      # The saved plan, exactly as the plan job showed it. A saved plan that
      # no longer matches state (another apply ran in between) is refused by
      # tofu, not applied. The outputs block at the end of an apply names the
      # instance, so it is not printed.
      - name: Apply the saved plan
        run: |
          set -euo pipefail
          tofu -chdir="$ROOT" apply -input=false -no-color deploy.tfplan 2>&1 \
            | sed -E -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g' \
              -e 's/(^|[^0-9])[0-9]{12}([^0-9]|$)/\1<account>\2/g' \
              -e '/^Outputs:/,$d'
      - name: Mask the instance alias
        if: always()
        run: |
          set -euo pipefail
          # A first apply creates the alias; mask it for the rest of the job.
          alias="$(tofu -chdir="$ROOT" output -raw instance_alias 2>/dev/null || true)"
          if [ -n "$alias" ]; then echo "::add-mask::$alias"; fi
